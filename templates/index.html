<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ群消息监控</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <span class="logo">QQ群消息监控</span>
        <div class="header-right">
            <span id="user-display" class="user-name"></span>
            <button class="btn btn-sm" onclick="doLogout()">退出</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="switchMainTab('history', this)">消息记录</button>
        <button class="tab" onclick="switchMainTab('keywords', this)">关键词管理</button>
        <button class="tab" onclick="switchMainTab('stats', this)">数据统计</button>
        <button class="tab" onclick="switchMainTab('settings', this)">设置</button>
    </div>

    <!-- === 消息记录 TAB === -->
    <div id="tab-history" class="tab-content active">
        <div class="toolbar">
            <input type="text" id="search-input" placeholder="搜索消息内容..." oninput="loadMessages()">
            <select id="sender-filter" onchange="loadMessages()">
                <option value="">全部发送者</option>
            </select>
            <select id="keyword-filter" onchange="loadMessages()">
                <option value="">全部关键词</option>
            </select>
            <button class="btn" onclick="loadMessages()">刷新</button>
            <button class="btn btn-outline" onclick="exportCSV()">导出CSV</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:140px">时间</th>
                        <th style="width:90px">发送者</th>
                        <th>内容</th>
                        <th style="width:140px">关键词</th>
                        <th style="width:72px">操作</th>
                    </tr>
                </thead>
                <tbody id="msg-table"></tbody>
            </table>
            <div id="no-messages" style="display:none;text-align:center;color:#999;padding:40px">暂无消息记录</div>
        </div>
    </div>

    <!-- === 关键词管理 TAB === -->
    <div id="tab-keywords" class="tab-content">
        <div class="toolbar">
            <input type="text" id="kw-input" placeholder="输入新关键词, 回车添加" onkeydown="if(event.key==='Enter')addKeyword()">
            <button class="btn btn-primary" onclick="addKeyword()">添加</button>
            <input type="text" id="kw-batch" placeholder="批量添加, 逗号分隔..." style="flex:1;margin-left:20px" onkeydown="if(event.key==='Enter')batchAdd()">
            <button class="btn" onclick="batchAdd()">批量添加</button>
            <select id="kw-mode-select" onchange="changeMode()">
                <option value="exact">精确匹配</option>
                <option value="regex">正则匹配</option>
            </select>
            <button class="btn btn-outline" onclick="resetKeywords()">恢复默认</button>
        </div>
        <div id="kw-list" class="kw-grid"></div>
    </div>

    <!-- === 设置 TAB === -->
    <div id="tab-settings" class="tab-content">
        <div class="settings-grid">
            <div class="setting-card">
                <h3>OneBot 连接</h3>
                <div class="setting-item">
                    <label>WebSocket 地址</label>
                    <input type="text" id="ws-url-input" value="ws://127.0.0.1:3001" onchange="saveSettings()">
                    <span style="color:#888;font-size:12px">NapCatQQ / LLOneBot 的 OneBot 11 WebSocket 地址</span>
                </div>
            </div>

            <div class="setting-card">
                <h3>监控参数</h3>
                <div class="setting-item">
                    <label>检测间隔 (秒)</label>
                    <input type="number" id="interval-input" value="5" min="1" max="60" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>群名称</label>
                    <input type="text" id="group-input" value="默认" onchange="saveSettings()">
                </div>
            </div>

            <div class="setting-card">
                <h3>选项</h3>
                <div class="setting-item">
                    <label><input type="checkbox" id="notify-check" onchange="saveSettings()" checked> 启用桌面通知</label>
                </div>
            </div>

            <div class="setting-card">
                <h3>监控控制</h3>
                <div id="monitor-status" class="monitor-status stopped">○ 已停止</div>
                <div class="setting-row">
                    <button class="btn btn-primary" id="btn-start" onclick="startMonitor()">▶ 开始监控</button>
                    <button class="btn btn-danger" id="btn-stop" onclick="stopMonitor()" disabled>■ 停止</button>
                </div>
            </div>
        </div>
    </div>

    <!-- === 数据统计 TAB === -->
    <div id="tab-stats" class="tab-content">
        <div class="stats-grid">
            <div class="stats-hero">
                <span class="stats-hero-value" id="stat-total">0</span>
                <span class="stats-hero-label">已捕获消息</span>
            </div>
            <div class="chart-card chart-wide">
                <h3>关键词命中排行</h3>
                <div class="chart-wrap"><canvas id="chart-keywords"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>发送者分布</h3>
                <div class="chart-wrap"><canvas id="chart-senders"></canvas></div>
            </div>
        </div>
    </div>

    <!-- 消息详情弹窗 -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>消息详情</span>
                <button class="close-btn" onclick="closeDetail()">&times;</button>
            </div>
            <div id="detail-body"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
