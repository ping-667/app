<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>框选QQ消息区域</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Microsoft YaHei', sans-serif; padding: 30px; }
h2 { margin-bottom: 20px; }
.row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.row label { width: 40px; text-align: right; font-size: 14px; color: #aaa; }
.row input {
    width: 80px; padding: 8px 10px; border: 1px solid #444;
    background: #16213e; color: #fff; border-radius: 6px;
    font-size: 14px; text-align: center;
}
.btns { display: flex; gap: 10px; margin: 16px 0; }
button {
    padding: 10px 24px; border: none; border-radius: 6px;
    font-size: 14px; cursor: pointer; font-weight: bold;
}
.btn-preview { background: #2196F3; color: #fff; }
.btn-save { background: #4caf50; color: #fff; }
.btn-back { background: #555; color: #fff; }
#preview-wrap { margin-top: 16px; }
#preview-wrap img { border: 2px solid #333; max-width: 100%; display: block; }
#status { margin-top: 10px; font-size: 13px; color: #aaa; }
.hint { color: #888; font-size: 12px; margin-left: 10px; }
</style>
</head>
<body>
<h2>设置区域坐标 —— 截取 QQ 消息显示区域</h2>
<p style="color:#888;margin-bottom:16px;font-size:13px">
先把浏览器窗口移到一边（不要最小化），让 QQ 群聊天窗口完整显示在桌面上。<br>
然后输入要截取的坐标范围，点「预览截图」看对不对。
</p>

<div class="row">
    <label>左 X</label>
    <input type="number" id="left" value="0" min="0">
    <label>上 Y</label>
    <input type="number" id="top" value="0" min="0">
    <label>宽度</label>
    <input type="number" id="width" value="600" min="50">
    <label>高度</label>
    <input type="number" id="height" value="400" min="50">
    <span class="hint">单位: 像素</span>
</div>

<div class="btns">
    <button class="btn-preview" onclick="doPreview()">预览截图</button>
    <button class="btn-save" onclick="doSave()">保存区域</button>
    <button class="btn-back" onclick="window.location.href='/'">返回</button>
</div>

<div id="preview-wrap">
    <img id="preview-img" style="display:none">
</div>
<div id="status"></div>

<script>
async function loadConfig() {
    const r = await fetch('/api/config');
    const d = await r.json();
    document.getElementById('left').value = d.region.left;
    document.getElementById('top').value = d.region.top;
    document.getElementById('width').value = d.region.width;
    document.getElementById('height').value = d.region.height;
}

function getRegion() {
    return {
        left: parseInt(document.getElementById('left').value) || 0,
        top: parseInt(document.getElementById('top').value) || 0,
        width: parseInt(document.getElementById('width').value) || 600,
        height: parseInt(document.getElementById('height').value) || 400,
    };
}

async function doPreview() {
    const region = getRegion();
    document.getElementById('status').textContent = '截图中...';
    const r = await fetch('/api/region/preview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(region),
    });
    const d = await r.json();
    if (d.ok) {
        const img = document.getElementById('preview-img');
        img.src = d.image;
        img.style.display = 'block';
        document.getElementById('status').textContent =
            `预览: ${d.width}x${d.height}px`;
    } else {
        document.getElementById('status').textContent = '截图失败: ' + (d.error || '');
    }
}

async function doSave() {
    const region = getRegion();
    const r = await fetch('/api/region/set', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...region, scale: 1}),
    });
    const d = await r.json();
    if (d.ok) {
        alert('区域已保存！');
        window.location.href = '/';
    } else {
        alert('保存失败');
    }
}

window.onload = loadConfig;
</script>
</body>
</html>
